name: Prueba en Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Etiqueta de la versión
        required: true
permissions:
  contents: read
jobs:
  prueba:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar la versión
        shell: pwsh
        run: |
          gh release download ${{ inputs.version }} -R ${{ github.repository }} -p Enterado.zip -D $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP\Enterado.zip" "$env:RUNNER_TEMP\zip"
      - name: FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Instalador
        shell: powershell
        run: |
          Get-Command py -All -ErrorAction SilentlyContinue | ForEach-Object {Remove-Item $_.Source -Force}
          if(Get-Command py -ErrorAction SilentlyContinue){throw 'py sigue'}
          & "$env:RUNNER_TEMP\zip\windows\preparar.ps1" -Prueba -Destino "$env:RUNNER_TEMP\Enterado"
      - name: Pruebas automáticas
        if: always()
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP\Enterado"
          $env:ENTERADO_DATA="$env:RUNNER_TEMP\datos-prueba"
          .venv\Scripts\python.exe -X utf8 -m unittest discover -s tests
      - name: Arrancar y apagar como servidor
        if: always()
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP\Enterado"
          Start-Process .venv\Scripts\pythonw.exe -ArgumentList '-X','utf8','guardian.py','--siempre' -WorkingDirectory $PWD
          Start-Sleep 25
          $estado=Invoke-RestMethod http://127.0.0.1:8775/api/state
          $estado.update | ConvertTo-Json
          (Invoke-WebRequest http://127.0.0.1:8775/ -UseBasicParsing).StatusCode
          cmd /c Detener-Enterado.cmd
          Start-Sleep 6
          $sigue=$true
          try{Invoke-RestMethod http://127.0.0.1:8775/api/state -TimeoutSec 3 | Out-Null}catch{$sigue=$false}
          if($sigue){throw 'Sigue encendido'}
          'Apagado'
      - name: Video completo
        if: always()
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP\Enterado"
          .venv\Scripts\python.exe -X utf8 windows\prueba_video.py "$env:RUNNER_TEMP\prueba-windows.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-windows
          path: |
            ${{ runner.temp }}/prueba-windows.mp4
            ${{ runner.temp }}/Enterado/data/server.log
          if-no-files-found: warn
